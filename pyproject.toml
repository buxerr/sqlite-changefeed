[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-changefeed"
version = "0.1.0"
description = "Transactional SQLite change capture and resumable peer apply adapter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "buxerr" }]
dependencies = []

[project.scripts]
sqlite-changefeed = "sqlite_changefeed.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
